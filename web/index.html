  <canvas id="backdrop" class="layer" aria-hidden="true"></canvas>
  <canvas id="snow-far" class="layer" aria-hidden="true"></canvas>

  <div class="stage">
    <div class="decor decor-tree" aria-hidden="true">
      <canvas id="tree"></canvas>
      <canvas id="tree-lights"></canvas>
    </div>
    <div class="decor decor-snowman" aria-hidden="true">
      <canvas id="snowman"></canvas>
    </div>

    <main class="tv">
      <div class="tv-antenna" aria-hidden="true"><i></i><i></i><b></b></div>
      <div class="tv-feet" aria-hidden="true"><i></i><i></i></div>

      <div class="tv-cabinet" id="cabinet">
        <div class="tv-face">
          <div class="tube-rim">
            <div class="tube" id="tube">
              <div class="picture" id="picture">

                <section class="view view-ident" id="view-ident" hidden>
                  <svg class="ident-initial" aria-hidden="true"><use href="#logo-initial"/></svg>
                  <svg class="ident-word" role="img" aria-label="Jukorama"><use href="#logo-word"/></svg>
                  <p class="ident-line">LA TÉLÉ DE NOËL</p>
                </section>

                <section class="view" id="view-gate" hidden>
                  <header class="osd-bar">
                    <span>P001</span>
                    <svg class="osd-logo" aria-hidden="true"><use href="#logo-mark"/></svg>
                    <span class="osd-title">JUKORAMA</span>
                    <span class="osd-clock">JOYEUX NOËL</span>
                  </header>
                  <h1 class="gate-title">Comment veux-tu voter ?</h1>
                  <div class="choices">
                    <button type="button" class="choice" id="pick-normal">
                      <span class="choice-key">1</span>
                      <span class="choice-name">Salle</span>
                      <span class="choice-text">Ton profil est gardé sur ce PC. Tu retrouves tes votes la prochaine fois.</span>
                    </button>
                    <button type="button" class="choice choice-booth" id="pick-private">
                      <span class="choice-key">2</span>
                      <span class="choice-name">Cabine privée</span>
                      <span class="choice-text">Profils jetables, rien n’est écrit sur le disque. Les comptes sont effacés quand tu éteins.</span>
                    </button>
                  </div>
                  <p class="gate-hint">Touches 1 et 2, ou clique.</p>
                </section>

                <section class="view view-tuning" id="view-tuning" hidden>
                  <svg class="logo-line tuning-logo" aria-hidden="true"><use href="#logo"/></svg>
                  <p class="tuning-title">RECHERCHE DES CHAÎNES</p>
                  <p class="tuning-text" id="tuning-text" role="status"></p>
                  <div class="meter" id="tuning-meter"><i></i></div>
                </section>

                <section class="view" id="view-queue" hidden>
                  <header class="osd-bar">
                    <span>P100</span>
                    <svg class="osd-logo" aria-hidden="true"><use href="#logo-mark"/></svg>
                    <span class="osd-title">JUKORAMA</span>
                    <span class="osd-mode" id="mode-badge"></span>
                    <span class="osd-clock" id="clock"></span>
                  </header>
                  <div class="party">
                    <h1 class="party-name" id="party-name"></h1>
                    <p class="party-meta" id="party-meta"></p>
                  </div>
                  <form class="search" id="search" role="search">
                    <label for="q">CHERCHER</label>
                    <input id="q" name="q" type="text" autocomplete="off" spellcheck="false" placeholder="un titre, un artiste…">
                    <kbd>Entrée ouvre le premier</kbd>
                  </form>
                  <div class="columns" id="columns">
                    <section class="col col-queue" aria-labelledby="queue-title">
                      <h2 class="col-title" id="queue-title">LA FILE</h2>
                      <ol class="rows scroll" id="rows"></ol>
                      <p class="empty" id="rows-empty" hidden></p>
                    </section>
                    <section class="col col-mine" id="mine" aria-labelledby="mine-title">
                      <h2 class="col-title" id="mine-title">MES VOTES</h2>
                      <div class="mine-body scroll" id="mine-body"></div>
                    </section>
                  </div>
                  <nav class="keys" aria-label="Actions">
                    <button type="button" class="key key-red" id="key-reset">Tout retirer</button>
                    <button type="button" class="key key-green" id="key-refresh">Actualiser</button>
                    <button type="button" class="key key-yellow" id="key-mine" aria-pressed="false">Mes votes</button>
                    <button type="button" class="key key-blue" id="key-leave">Éteindre</button>
                  </nav>
                </section>

                <section class="overlay" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheet-title">
                  <header class="osd-bar">
                    <span>P300</span>
                    <span class="osd-title">VOTER</span>
                    <button type="button" class="osd-close" id="sheet-close">Retour</button>
                  </header>
                  <div class="sheet-body scroll">
                    <div class="sheet-cover" id="sheet-cover"></div>
                    <div class="sheet-main">
                      <div class="sheet-head">
                        <h2 class="sheet-title" id="sheet-title"></h2>
                        <p class="sheet-artist" id="sheet-artist"></p>
                        <p class="sheet-stats" id="sheet-stats"></p>
                      </div>
                      <div class="sheet-notes" id="sheet-notes"></div>
                      <div class="amount">
                        <button type="button" class="step" id="amount-less" aria-label="Un vote de moins">−</button>
                        <span class="amount-value" id="amount-value" aria-live="polite"></span>
                        <button type="button" class="step" id="amount-more" aria-label="Un vote de plus">+</button>
                        <div class="chips" id="amount-chips"></div>
                      </div>
                      <div class="sheet-actions">
                        <button type="button" class="key key-green key-big" id="sheet-vote"></button>
                        <button type="button" class="key key-red" id="sheet-withdraw" hidden></button>
                      </div>
                      <div class="meter" id="sheet-meter" hidden><i></i></div>
                    </div>
                  </div>
                </section>

                <section class="overlay" id="dialog" hidden role="dialog" aria-modal="true" aria-labelledby="dialog-title">
                  <header class="osd-bar">
                    <span id="dialog-page"></span>
                    <span class="osd-title" id="dialog-title"></span>
                  </header>
                  <div class="dialog-body scroll" id="dialog-body"></div>
                  <div class="dialog-actions" id="dialog-actions"></div>
                </section>

                <div class="stamp" id="stamp" hidden role="status">
                  <p class="stamp-count" id="stamp-count"></p>
                  <p class="stamp-title" id="stamp-title"></p>
                  <p class="stamp-total" id="stamp-total"></p>
                </div>

                <div class="wait" id="wait" hidden role="status">
                  <p id="wait-text"></p>
                  <div class="meter is-waiting"><i></i></div>
                </div>

                <section class="view view-nosignal" id="view-nosignal" hidden>
                  <div class="nosignal-box">
                    <svg class="logo-line nosignal-logo" aria-hidden="true"><use href="#logo"/></svg>
                    <p class="nosignal-title">PAS DE SIGNAL</p>
                    <p id="nosignal-text" role="alert"></p>
                    <button type="button" class="key key-green" id="nosignal-retry">Réessayer</button>
                  </div>
                </section>

                <section class="view view-bye" id="view-bye" hidden>
                  <svg class="logo-line bye-logo" aria-hidden="true"><use href="#logo"/></svg>
                  <p class="bye-title">À LA PROCHAINE</p>
                  <div class="bye-text" id="bye-text" role="status"></div>
                </section>

                <p class="toast" id="toast" hidden role="status"></p>
              </div>

              <canvas class="tube-fx tube-noise" id="tube-noise" width="192" height="128" aria-hidden="true"></canvas>
              <div class="tube-fx tube-lines" aria-hidden="true"></div>
              <div class="tube-fx tube-roll" aria-hidden="true"></div>
              <div class="tube-fx tube-beam" aria-hidden="true"></div>
              <div class="tube-fx tube-glass" aria-hidden="true"></div>
              <button type="button" class="note" id="note">
                <b id="note-title">Allume-moi !</b>
                <span id="note-text">Bouton MARCHE, à droite →</span>
              </button>
            </div>
          </div>
        </div>

        <aside class="tv-panel" aria-label="Réglages de la télévision">
          <div class="plate" role="img" aria-label="Jukorama Noël-o-Vision">
            <svg class="plate-logo" aria-hidden="true"><use href="#logo-colour"/></svg>
            <svg class="plate-badge" aria-hidden="true"><use href="#logo-badge"/></svg>
            <span aria-hidden="true">Noël-o-Vision</span>
          </div>
          <div class="faders">
            <label class="fader">
              <span class="fader-slot"><i class="fader-knob"></i><input type="range" id="fader-snow" min="0" max="100" step="5" value="100" aria-label="Neige"></span>
              <span class="fader-name">NEIGE</span>
            </label>
            <label class="fader">
              <span class="fader-slot"><i class="fader-knob"></i><input type="range" id="fader-crt" min="0" max="100" step="5" value="100" aria-label="Effet cathodique"></span>
              <span class="fader-name">CRT</span>
            </label>
            <label class="fader">
              <span class="fader-slot"><i class="fader-knob"></i><input type="range" id="fader-sound" min="0" max="100" step="5" value="70" aria-label="Son"></span>
              <span class="fader-name">SON</span>
            </label>
          </div>
          <button type="button" class="tune" id="tune" aria-label="Musique : morceau suivant">
            <svg class="tune-icon" aria-hidden="true"><use href="#icon-note"/></svg>
            <span class="tune-name" id="tune-name"></span>
            <svg class="tune-icon tune-skip" aria-hidden="true"><use href="#icon-skip"/></svg>
          </button>
          <div class="grille" aria-hidden="true"></div>
          <button type="button" class="power" id="power" aria-pressed="false" aria-label="Marche / arrêt">
            <i class="power-led" aria-hidden="true"></i>
            <span class="power-cap"><svg aria-hidden="true"><use href="#icon-power"/></svg></span>
            <span>MARCHE</span>
          </button>
        </aside>
      </div>
    </main>
  </div>

  <canvas id="snow-near" class="layer" aria-hidden="true"></canvas>
  <canvas id="confetti" class="layer" aria-hidden="true"></canvas>
</body>
</html>
